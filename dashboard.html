<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>PixelBot Dashboard</title>

<style>

body {

margin:0;
min-height:100vh;

font-family:Arial, sans-serif;

color:white;

background:
linear-gradient(
135deg,
#01030a,
#020817,
#04152d
);

display:flex;
align-items:center;
justify-content:center;

}


.dashboard {

text-align:center;

padding:40px;

background:
rgba(255,255,255,0.05);

border:
1px solid rgba(79,140,255,0.3);

border-radius:20px;

}


h1 {

color:#4f8cff;

}


</style>

</head>


<body>
<body>

<div class="dashboard">

<img id="avatar" width="100" style="border-radius:50%;">

<h1>
PIXELBOT DASHBOARD
</h1>

<h2 id="username">
Loading user...
</h2>

<p>
Welcome to your command centre.
</p>

</div>


<script>

<script>

const cookies = document.cookie;

const userCookie = cookies
.split("; ")
.find(row => row.startsWith("discord_user="));


if(userCookie){

    const user = JSON.parse(
        decodeURIComponent(
            userCookie.split("=")[1]
        )
    );


    document.getElementById("username")
    .innerHTML =
    "Welcome, " + user.username;

}

</script>


</body>

</html>
